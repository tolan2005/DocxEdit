# XcodeGen: xcodegen generate --spec UITests/project.yml  →  UITests/DocxEditUI.xcodeproj
# Нужен только для XCUITest; релизная сборка по-прежнему через scripts/build.sh.
name: DocxEditUI
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  DocxEditPkg:
    path: ..
targets:
  DocxEdit:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/DocxEdit/Sources
      - path: AppShim
    dependencies:
      - package: DocxEditPkg
        products: [DocxCore, DocxIO, RtfIO, MarkdownIO, PdfExporter, EncodingDetector]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: app.docxedit.DocxEdit.uitest
      MARKETING_VERSION: "0.0.0-uitest"
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
      SWIFT_VERSION: "5.9"
  DocxEditUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: DocxEditUITests
    dependencies:
      - target: DocxEdit
    settings:
      CODE_SIGN_IDENTITY: "-"
      SWIFT_VERSION: "5.9"
      TEST_TARGET_NAME: DocxEdit
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: app.docxedit.DocxEditUITests
schemes:
  DocxEditUI:
    build:
      targets:
        DocxEdit: all
        DocxEditUITests: [test]
    test:
      targets: [DocxEditUITests]
