# CI DocxEdit — юнит-тесты DocxCore/DocxIO на каждый push/PR.
#
# Репозиторий приватный (DocxEdit-src) — публичный tolan2005/DocxEdit
# сознательно содержит только README + Releases.
# Запуски: push в main, PR, ручной workflow_dispatch, расписание (пн 06:00 UTC).
# NB 2026-08-18: push-триггер на свежесозданном репо не регистрировался
# (Actions enabled, runs идут через dispatch/schedule) — если GitHub починит,
# push-ветка уже на месте.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test 2>&1 | tee test-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
